pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,json,md,yml,yaml}'
      run: bun run fmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts}'
      run: bun run lint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: check
      run: bun run check

    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test
