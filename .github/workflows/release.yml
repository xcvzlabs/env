name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}"
            exit 1
          fi

      - name: Run oxlint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Run typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  publish:
    name: Publish to npm
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          registry-url: https://registry.npmjs.org

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --provenance --access public

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v tag="$TAG" '
            $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes."
          fi

          release_id=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)

          if [ -n "$release_id" ]; then
            gh api "repos/${{ github.repository }}/releases/$release_id" \
              -X PATCH \
              -f name="$TAG" \
              -f body="$notes" \
              -F draft=false \
              -F prerelease=false \
              --silent
          else
            gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f body="$notes" \
              -F draft=false \
              -F prerelease=false \
              --silent
          fi
